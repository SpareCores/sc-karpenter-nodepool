# This rule is not used by the project sc-karpenter-nodepool itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to karpenter.sparecores.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sc-karpenter-nodepool
    app.kubernetes.io/managed-by: kustomize
  name: scnodepool-viewer-role
rules:
- apiGroups:
  - karpenter.sparecores.com
  resources:
  - scnodepools
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - karpenter.sparecores.com
  resources:
  - scnodepools/status
  verbs:
  - get
