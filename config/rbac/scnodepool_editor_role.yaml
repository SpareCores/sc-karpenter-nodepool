# This rule is not used by the project sc-karpenter-nodepool itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the karpenter.sparecores.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sc-karpenter-nodepool
    app.kubernetes.io/managed-by: kustomize
  name: scnodepool-editor-role
rules:
- apiGroups:
  - karpenter.sparecores.com
  resources:
  - scnodepools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - karpenter.sparecores.com
  resources:
  - scnodepools/status
  verbs:
  - get
