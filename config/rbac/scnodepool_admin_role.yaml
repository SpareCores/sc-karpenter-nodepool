# This rule is not used by the project sc-karpenter-nodepool itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over karpenter.sparecores.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sc-karpenter-nodepool
    app.kubernetes.io/managed-by: kustomize
  name: scnodepool-admin-role
rules:
- apiGroups:
  - karpenter.sparecores.com
  resources:
  - scnodepools
  verbs:
  - '*'
- apiGroups:
  - karpenter.sparecores.com
  resources:
  - scnodepools/status
  verbs:
  - get
