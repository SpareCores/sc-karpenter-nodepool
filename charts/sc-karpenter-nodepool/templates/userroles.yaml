{{- if .Values.rbac.userRoles.create }}
# Roles for the users of SCNodePools (config/rbac/scnodepool_*_role.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sckn.fullname" . }}-scnodepool-admin
  labels:
    {{- include "sckn.labels" . | nindent 4 }}
rules:
  - apiGroups: [karpenter.sparecores.com]
    resources: [scnodepools]
    verbs: ["*"]
  - apiGroups: [karpenter.sparecores.com]
    resources: [scnodepools/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sckn.fullname" . }}-scnodepool-editor
  labels:
    {{- include "sckn.labels" . | nindent 4 }}
rules:
  - apiGroups: [karpenter.sparecores.com]
    resources: [scnodepools]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [karpenter.sparecores.com]
    resources: [scnodepools/status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sckn.fullname" . }}-scnodepool-viewer
  labels:
    {{- include "sckn.labels" . | nindent 4 }}
rules:
  - apiGroups: [karpenter.sparecores.com]
    resources: [scnodepools]
    verbs: [get, list, watch]
  - apiGroups: [karpenter.sparecores.com]
    resources: [scnodepools/status]
    verbs: [get]
{{- end }}
