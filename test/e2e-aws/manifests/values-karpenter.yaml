# Helm values of the controller on the self-managed Karpenter cluster: it runs
# on the managed node group, which Karpenter does not launch (the chart's
# default preference); made a rule here.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: karpenter.sh/nodepool, operator: DoesNotExist}
logging:
  level: debug
