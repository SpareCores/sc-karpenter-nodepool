# Source: sc-karpenter-nodepool/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sckn
  namespace: sc-karpenter-nodepool
  labels:
    helm.sh/chart: sc-karpenter-nodepool-0.0.0-dev
    app.kubernetes.io/name: sckn
    app.kubernetes.io/instance: sckn
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
  annotations:
    example.com/note: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sckn
      app.kubernetes.io/instance: sckn
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        example.com/note: pod
      labels:
        helm.sh/chart: sc-karpenter-nodepool-0.0.0-dev
        app.kubernetes.io/name: sckn
        app.kubernetes.io/instance: sckn
        app.kubernetes.io/version: "dev"
        app.kubernetes.io/managed-by: Helm
        team: platform
    spec:
      imagePullSecrets:
        - name: registry
      serviceAccountName: sckn
      automountServiceAccountToken: true
      priorityClassName: "system-cluster-critical"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "ghcr.io/sparecores/sc-karpenter-nodepool@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          imagePullPolicy: Always
          command:
            - /manager
          args:
            - "--leader-elect=true"
            - "--health-probe-bind-address=:9081"
            - "--metrics-bind-address=:9443"
            - "--metrics-secure=true"
            - "--enable-http2=true"
            - "--keeper-url=https://keeper.example.com"
            - "--keeper-timeout=90s"
            - "--keeper-regions-per-request=8"
            - "--keeper-api-key-file=/etc/sc-karpenter-nodepool/keeper/api-key"
            - "--data-cache-ttl=30m"
            - "--aws-price-list-url=https://pricing.example.com"
            - "--max-concurrent-reconciles=8"
            - "--nodeclass-discovery-interval=1m"
            - "--node-class-ref-override=karpenter.kwok.sh/KWOKNodeClass/default"
            - "--zap-devel=true"
            - "--zap-encoder=console"
            - "--zap-log-level=debug"
            - "--zap-stacktrace-level=panic"
            - "--zap-time-encoding=rfc3339"
            - "--zap-time-encoding=epoch"
          env:
            - name: HTTPS_PROXY
              value: http://proxy.example.com:3128
          ports:
            - name: health
              containerPort: 9081
              protocol: TCP
            - name: metrics
              containerPort: 9443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: keeper-api-key
              mountPath: /etc/sc-karpenter-nodepool/keeper
              readOnly: true
            - mountPath: /etc/ssl/extra
              name: ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: keeper-api-key
          secret:
            secretName: "keeper-credentials"
            items:
              - key: "token"
                path: api-key
        - configMap:
            name: corporate-ca
          name: ca
      nodeSelector:
        kubernetes.io/os: linux
        node-role.example.com/system: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
            weight: 50
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: DoesNotExist
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: sckn
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway

