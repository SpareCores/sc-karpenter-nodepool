name: CI

# Runs the gates of docs/plans/v1/CONVENTIONS.md inside the dev container, the
# same way a developer does with hack/dev.sh.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-image

      - name: Generated code, CRDs, chart and API docs are up to date
        run: |
          hack/dev.sh make generate manifests chart-crds chart-rbac docs-api
          git add -N .
          git diff --exit-code

      - name: Lint
        run: hack/dev.sh make lint

      - name: Test
        run: hack/dev.sh make test

      - name: Helm chart (lint, golden output, CRD and RBAC in sync)
        run: hack/dev.sh make test-chart

      - name: Documentation links
        run: hack/dev.sh make test-docs

      - name: L5 configuration (eksctl configs and manifests, offline)
        run: hack/dev.sh make test-e2e-aws

      - name: Lint workflows and scripts
        run: hack/dev.sh bash -c 'actionlint && shellcheck -x hack/*.sh test/*.sh test/*/*.sh'

  # L2: every provider's NodePool CRD against the golden NodePools and the
  # negative cases (overview §8.3).
  crd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-image

      - name: CRD admission matrix
        run: hack/dev.sh make test-crd

      - name: Upload the log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-crd
          path: test/crd/.out/
          if-no-files-found: ignore

  # L3: real core Karpenter (KWOK provider) in kind, once per core version the
  # supported providers pin (overview §8.2).
  kwok:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        core: [v1.2, v1.8, v1.12, v1.14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-image

      - name: KWOK e2e (core ${{ matrix.core }})
        run: hack/dev.sh make test-kwok KWOK_CORE_VERSION=${{ matrix.core }}

      - name: Upload logs and catalogs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-kwok-${{ matrix.core }}
          path: test/kwok/.out/${{ matrix.core }}/
          if-no-files-found: ignore
